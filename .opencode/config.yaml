# OpenCode Configuration - FakeData

## Project Settings
project:
  name: "FakeData"
  type: "chrome-extension"
  language: "javascript"
  packageManager: "npm"

## Model Configuration
model:
  provider: "opencode"
  id: "nemotron-3-ultra-free"
  temperature: 0.3
  maxTokens: 8192

## Agent Team Configuration
agents:
  - architect
  - ui-ux
  - data-generation
  - selector-engine
  - content-script
  - messaging
  - storage-profile
  - testing
  - devops
  - documentation

## Skills
skills:
  - fakedata-architect
  - fakedata-generator
  - fakedata-selector-engine
  - fakedata-content-script
  - fakedata-messaging
  - fakedata-storage-profile
  - fakedata-testing
  - fakedata-devops
  - fakedata-documentation
  - fakedata-ui-ux

## Hooks
hooks:
  pre-commit:
    - ".opencode/hooks/pre-commit/01-lint.sh"
    - ".opencode/hooks/pre-commit/02-test-changed.sh"
  pre-push:
    - ".opencode/hooks/pre-push/01-full-test.sh"
    - ".opencode/hooks/pre-push/02-version-check.sh"
  post-merge:
    - ".opencode/hooks/post-merge/01-install-deps.sh"
    - ".opencode/hooks/post-merge/02-clear-cache.sh"
  session-start:
    - ".opencode/hooks/session-start/01-load-context.sh"
  session-end:
    - ".opencode/hooks/session-end/01-save-memory.sh"

## Workflows
workflows:
  - feature-development
  - bug-fix
  - refactoring
  - cross-cutting-change
  - release-preparation

## Context Files (Auto-loaded on session start)
context:
  - ".opencode/team/context/architecture-decisions.md"
  - ".opencode/team/context/api-contracts.md"
  - ".opencode/team/context/coding-standards.md"
  - ".opencode/team/context/testing-strategy.md"

## Memory
memory:
  enabled: true
  directory: ".opencode/team/memory"
  perAgent: true

## Testing
testing:
  framework: "vitest"
  environment: "jsdom"
  coverage:
    provider: "v8"
    thresholds:
      lines: 90
      functions: 90
      branches: 80
      statements: 90
  commands:
    test: "npm test"
    coverage: "npm run test:coverage"

## Build/Release
build:
  type: "chrome-extension"
  manifest: "manifest.json"
  output: "dist/"
  packageExclude:
    - "node_modules/**"
    - "tests/**"
    - "coverage/**"
    - ".git/**"
    - ".opencode/**"
    - "*.md"
    - "vitest.config.js"
    - "package*.json"
    - ".github/**"

## Git Integration
git:
  hooksEnabled: true
  conventionalCommits: true
  branchPrefixes:
    - "feature/"
    - "fix/"
    - "refactor/"
    - "docs/"
    - "chore/"

## IDE Integration
ide:
  vscode:
    settings:
      "editor.formatOnSave": true
      "editor.codeActionsOnSave": "source.fixAll"
    extensions:
      - "dbaeumer.vscode-eslint"
      - "esbenp.prettier-vscode"

## Language
language: "pt-BR"