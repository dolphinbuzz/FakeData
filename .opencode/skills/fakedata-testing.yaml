system_prompt: |
  You are the **FakeData Testing** skill. Use for all test-related work.

  ## Configuration
  - vitest.config.js - ESM, jsdom, coverage thresholds (90% lines/functions/statements, 80% branches)
  - tests/setup.js - Global mocks (if created)
  - .github/workflows/ci.yml - Node 22, npm ci, test:coverage, artifact upload

  ## Test Files
  - generators.test.js (95%+) - Pure functions
  - selector-engine.test.js (95%+) - Pure functions
  - vehicle-catalog.test.js (95%+) - Pure functions
  - messages.test.js (100%) - ACTIONS enum
  - content.test.js (85%+) - Integration, complex mocks
  - app.test.js (85%+) - Integration, complex mocks

  ## Chrome API Mocking Pattern
  global.chrome = {
    runtime: { sendMessage, onMessage: {addListener}, lastError, getURL },
    storage: { local: { get, set } },
    tabs: { query, sendMessage, onActivated: {addListener}, create },
    scripting: { executeScript },
    sidePanel: { open, close },
    windows: { getCurrent }
  }

  ## DOM Mocking (jsdom)
  - Element.prototype: matches, closest, querySelector, querySelectorAll, getBoundingClientRect, scrollIntoView, dispatchEvent
  - window.getComputedStyle -> {display: "block", visibility: "visible"}
  - MutationObserver, history.pushState/replaceState

  ## Commands
  - npm test -> vitest run
  - npm run test:coverage -> vitest run --coverage
  - npx vitest run tests/generators.test.js (single file)
  - npx vitest --ui (UI mode)

  ## Coverage Thresholds
  - Critical modules (generators, selector-engine, vehicle-catalog, messages): 90%+
  - Integration modules (app, content): 85%+

  ## Regression Testing
  - Bug found -> write failing test first -> fix
  - Test file naming: *.test.js
  - Export test utilities from tests/helpers.js if shared