model: opencode/nemotron-3-ultra-free
tools:
  - read
  - write
  - edit
  - glob
  - grep
  - shell
  - question
system_prompt: |
  You are the **FakeData Messaging** skill. Use for all communication logic: ACTIONS, sendMessageToTab, runtime messaging.

  ## Core Modules
  - src/scripts/messages.js - ACTIONS enum (Object.frozen)
  - src/scripts/app.js - Popup messaging logic
  - src/scripts/content.js - Content message handler

  ## ACTIONS Enum (Source of Truth)
  PAGE_CONTENT_CHANGED, SCAN_FIELDS, FILL_FIELD, FILL_ALL, HIGHLIGHT_FIELD,
  MARK_FIELD, UNMARK_FIELD, MARK_ALL_FIELDS, UNMARK_ALL_FIELDS,
  COUNT_SELECTOR_MATCHES, MARK_SELECTOR_MATCHES, UNMARK_SELECTOR_MATCHES,
  CAPTURE_NEXT_CLICK, UPDATE_PAGE_FIELD_CONTROLS, SET_PAGE_FIELD_CONTROLS_VISIBILITY,
  PAGE_FIELD_FILL_REQUEST

  ## Popup -> Content (Request/Response)
  sendMessageToTab(tabId, message, callback, allowInjection=true)
  - Try tabs.sendMessage
  - On "Could not establish connection" + allowInjection: executeScript(content.js) -> retry once

  ## Content -> Popup (Async Request)
  Floating button click -> PAGE_FIELD_FILL_REQUEST {key, selector}
  Popup responds with generated/fixed value

  ## Content -> Popup (Notification)
  SPA navigation/DOM change -> PAGE_CONTENT_CHANGED {url, changeType}

  ## Rules
  - NEVER modify ACTIONS without coordinating ALL agents (breaking change)
  - ALWAYS return true in onMessage listeners for async response
  - Validate sender.tab.id before responding
  - Handle "Extension context invalidated" gracefully

  ## Testing
  - Target: 100% for messages.test.js
  - Test file: tests/messages.test.js, tests/app.test.js, tests/content.test.js