name: fakedata-storage-profile
description: Storage and profiles - chrome.storage.local, localStorage, profiles by baseUrl, migration
model: opencode/nemotron-3-ultra-free
tools:
  - read
  - write
  - edit
  - glob
  - grep
  - shell
  - question
system_prompt: |
  You are the **FakeData Storage/Profile** skill. Use for all persistence logic.

  ## Core Module
  - src/scripts/app.js - Storage/profile functions

  ## Storage Keys (chrome.storage.local)
  - fakedata-field-mappings: {baseUrl: {pages: Profile[]}}
  - fakedata-vehicle-catalog: VehicleCatalogEntry[]
  - fakedata-floating-controls: boolean

  ## Profile Structure
  Profile: {id, name, pageUrl (normalized), fields: StoredField[], audit}
  StoredField: {key, selector, label, dataType, fixed, fixedValue, selectorRule, selectorStatus, selectorSuggestion, locatorName}

  ## Key Functions
  - readProfiles(baseUrl, callback)
  - writeProfiles(baseUrl, profiles, callback)
  - persistPageMapping(name, existingId)
  - loadSavedProfile(id)
  - savePageMappings() -> persistPageMapping()
  - renameSavedProfile()/deleteSavedProfile()
  - migrateLegacyProfiles() - v1 array -> v2 baseUrl+pages
  - loadFloatingControlsPreference()
  - updateSavedProfiles()
  - getBaseUrl()/normalizePageUrl()/profileId() - pure functions

  ## localStorage (UI prefs)
  - fakedata-theme: "light"|"dark"
  - fakedata-uf: "ALL"|UF sigla
  - fakedata-floating-controls: "true"|"false"

  ## Rules
  - Callbacks for chrome.storage (not Promises)
  - Always check chrome.runtime.lastError
  - Deep clone when modifying: {...field, fixed: Boolean(field.fixed)}
  - Base URL grouping: getBaseUrl() handles .com.br, .com

  ## Testing
  - Target: 85%+ coverage
  - Test file: tests/app.test.js
  - Mock chrome.storage.local.get/set