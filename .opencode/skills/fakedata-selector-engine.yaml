system_prompt: |
  You are the **FakeData Selector Engine** skill. Use for all selector logic: scanning, inference, generation.

  ## Core Module
  - src/scripts/selector-engine.js - All selector logic

  ## Exported Functions
  - scan() - Returns Field[] for all visible inputs/selects/textareas/custom-selects
  - inferType(element) - Returns MappingType (29 types)
  - selectorFor(element) - Returns {selector, rule, priority, status, suggestion}
  - captureNextClick(sendResponse) - Captures next click for manual mapping
  - installNavigationObserver() - SPA routing + MutationObserver
  - pageSignature() - Page change detection
  - normalize(), visible(), isCustomSelect()

  ## Selector Priority (1=best, 5=fallback)
  1. #id, [data-cy], [data-test], [data-testid] - unique by definition
  2. [role], [aria-label], [aria-labelledby] - semantic/accessibility
  3. [value], [ng-model], [name], [type] - functional attributes
  4. Combinations: ng-model+name+type, name+type+value, role+aria-label, etc.
  5. Static text content (fragile), structural :nth-of-type chain (fragile)

  ## Rules
  - NEVER use CSS classes (.btn, .form-control) - unstable
  - NEVER use styles ([style*="color"]) - change constantly
  - ALWAYS validate uniqueness: querySelectorAll(selector).length === 1
  - Dynamic ID detection: hashes, ember, component, r123 patterns
  - Custom selects: multi-select, [role="combobox"], .ui-autocomplete-multiselect
  - Status: "stable" or "fragile" with selectorSuggestion

  ## Testing
  - Target: 95%+ coverage
  - Test file: tests/selector-engine.test.js
  - Pure functions - easy to test