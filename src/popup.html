<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FakeData</title>
    <link rel="stylesheet" href="styles/popup.css">
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="brand-mark" aria-hidden="true">FD</div>
        <div>
          <h1>FakeData</h1>
          <p>Dados falsos para seus testes</p>
        </div>
        <div class="hero-actions">
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Ativar tema claro">
            <span aria-hidden="true">☀</span>
          </button>
          <button id="open-sidepanel-button" class="open-sidepanel-button" type="button" title="Abrir na lateral" aria-label="Abrir na lateral">
            <svg class="sidepanel-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <path d="M15 4v16M18 9v6"></path>
            </svg>
          </button>
        </div>
      </header>

      <section class="generator-panel" aria-labelledby="generator-title">
        <div class="section-heading">
          <div>
            <span class="eyebrow">Gerador</span>
            <h2 id="generator-title">Escolha o tipo de dado</h2>
          </div>
          <span class="qa-badge">QA</span>
        </div>

        <div class="type-grid" role="group" aria-label="Tipo de dado">
          <button class="type-button active" type="button" data-type="person">
            <span class="type-icon" aria-hidden="true">👤</span>
            <span>Pessoa</span>
          </button>
          <button class="type-button" type="button" data-type="vehicle">
            <span class="type-icon" aria-hidden="true">🚗</span>
            <span>Veículo</span>
          </button>
          <button class="type-button" type="button" data-type="company">
            <span class="type-icon" aria-hidden="true">🏢</span>
            <span>Empresa</span>
          </button>
        </div>

        <label class="uf-control" for="uf-select">
          <span class="options-label">UF dos dados</span>
          <select id="uf-select">
            <option value="ALL">Todas as UFs</option>
          </select>
        </label>

        <div id="person-options" class="format-options">
          <span class="options-label">Opções de CPF</span>
          <label class="checkbox-option">
            <input id="cpf-formatted" type="checkbox" checked>
            <span>Com pontuação</span>
          </label>
        </div>

        <div id="company-options" class="format-options is-hidden">
          <span class="options-label">Opções de CNPJ</span>
          <label class="checkbox-option">
            <input id="cnpj-alphanumeric" type="checkbox">
            <span>Alfanumérico</span>
          </label>
          <label class="checkbox-option">
            <input id="cnpj-formatted" type="checkbox" checked>
            <span>Com pontuação</span>
          </label>
        </div>

        <button id="generate-button" class="generate-button" type="button">
          <span aria-hidden="true">✦</span>
          Gerar <span id="generate-label">Pessoa</span>
        </button>
      </section>

      <section id="result-section" class="result-section is-hidden" aria-live="polite">
        <div class="result-heading">
          <div>
            <span class="eyebrow">Resultado</span>
            <h2 id="result-title">Pessoa gerada</h2>
          </div>
          <button id="copy-json-button" class="copy-all-button" type="button">Copiar JSON</button>
        </div>
        <div id="result-fields" class="result-fields"></div>
      </section>

      <section id="page-fields-section" class="page-fields-section" aria-labelledby="page-fields-title">
        <div class="result-heading">
          <div>
            <span class="eyebrow">Página atual</span>
            <h2 id="page-fields-title">Mapear campos</h2>
          </div>
          <div class="mapping-header-actions">
            <button id="scan-fields-button" class="copy-all-button" type="button">Escanear campos</button>
            <button id="save-mappings-button" class="copy-all-button" type="button">Salvar seletores</button>
            <button id="fill-all-button" class="generate-button compact-button" type="button">Preencher todos</button>
          </div>
        </div>
        <p id="page-fields-status" class="page-fields-status">Abra uma página com um formulário para começar.</p>
        <div id="page-fields" class="page-fields"></div>
      </section>

      <footer>
        <span>Feito para QAs</span>
        <span class="dot" aria-hidden="true"></span>
        <span>Chrome &amp; Edge</span>
        <span class="dot" aria-hidden="true"></span>
        <a href="privacy.html" target="_blank">Privacidade</a>
      </footer>
    </main>
    <script src="scripts/app.js"></script>
  </body>
</html>
